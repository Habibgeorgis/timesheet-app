services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timesheet
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
    ports:
      - "5433:5432"
    volumes:
      - timesheet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timesheet_postgres_data:
